[workspace]
members = [
    "crates/app",
    "crates/renderer",
    "crates/document",
    "crates/ui",
    "crates/settings",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
image = "0.25"
parking_lot = "0.12"
futures = "0.3"
pdfium-render = { version = "0.9.0", features = ["image_025"] }
dirs = "6"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
